<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Team Photos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:aliceblue;
            margin: 0;
            padding: 0;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .gallery-item {
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .gallery-item img {
            display: block;
            float: left;
            width:  300px;
            height: 300px;
            object-fit: cover;
        }
        .gallery-item:hover {
            box-shadow: 0 4px 10px rgba(251, 92, 52, 0.4);
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; padding: 20px;">Management Team Photos</h1>
    <div class="gallery">

            <img src="images\IMG-20240901-WA0060.jpg" alt="Photo 1">
